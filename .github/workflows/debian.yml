name: debian-build
on:
  workflow_dispatch:
    inputs:
      reuse:
        description: "Purana kernel is release tag se lo (khali = naya compile)"
        default: "tiny-4"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev libelf-dev cpio xz-utils zstd python3 \
            debootstrap debian-archive-keyring grub-pc-bin grub-efi-amd64-bin xorriso mtools squashfs-tools busybox-static qemu-system-x86 ovmf ffmpeg socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
      - name: Kernel
        if: inputs.reuse == ''
        run: bash tiny/build-kernel.sh
      - name: Kernel (reuse)
        if: inputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out old && cd old
          gh release download "${{ inputs.reuse }}" -R "$GITHUB_REPOSITORY" -p SmartOS-Tiny.iso
          xorriso -osirrox on -indev SmartOS-Tiny.iso -extract /boot/vmlinuz ../out/vmlinuz -extract /smartos.sfs sfs >/dev/null 2>&1
          mkdir -p ../out/modroot/lib; unsquashfs -d m sfs lib/modules >/dev/null; cp -a m/lib/modules ../out/modroot/lib/
          ls -lh ../out/vmlinuz; du -sh ../out/modroot; cd ..; rm -rf old
      - name: Smart OS page
        run: |
          mkdir -p xt/x xt/f; (cd xt/x && npm pack xterm@5.3.0 >/dev/null 2>&1 && tar xzf xterm-*.tgz) || echo npm-xterm-fail
          (cd xt/f && npm pack xterm-addon-fit@0.8.0 >/dev/null 2>&1 && tar xzf xterm-addon-fit-*.tgz) || echo npm-fit-fail
          python3 - <<'PY'
          s=open('Smart_OS_V_1_110.html',encoding='utf-8').read()
          js=open('linuxapps.js',encoding='utf-8').read()
          s=s.replace('navigator.storage.persist&&navigator.storage.persist()','0')
          s=s.replace('<head>','<head>'+"<script>try{var g={getCurrentPosition:function(a,b){b&&b({code:1,message:'denied'})},watchPosition:function(a,b){b&&b({code:1,message:'denied'});return 0},clearWatch:function(){}};Object.defineProperty(navigator,'geolocation',{value:g,configurable:true})}catch(e){}</script>",1)
          s=s.replace('onclick="maximizeWindow(this)">☐','onclick="maximizeWindow(this)"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="8" height="8" rx="1"/></svg>',1)
          s=s.replace('onclick="closeWindow(this)">✕','onclick="closeWindow(this)"><svg width="11" height="11" viewBox="0 0 11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5L9.5 9.5M9.5 1.5L1.5 9.5"/></svg>',1)
          s=s.replace('✕','×').replace('✖','×')
          s=s.replace("var cats=['All','Work','Create','Games','Media','AI','My Apps','System']","var cats=['All','Work','Create','Games','Media','AI','Linux','My Apps','System']")
          i=s.rfind('</body>')
          import os
          lib=''
          try:
              r=lambda f: open(f,encoding='utf-8').read()
              css=r('xt/x/package/css/xterm.css'); x=r('xt/x/package/lib/xterm.js'); f=r('xt/f/package/lib/xterm-addon-fit.js')
              lib='<style>'+css+'</style><script>'+x.replace('</script','<\\/script')+'</script><script>'+f.replace('</script','<\\/script')+'</script>\n'
              print('xterm ok',len(lib))
          except Exception as e:
              print('xterm fail (fallback terminal)',e)
          open('out/index.html','w',encoding='utf-8').write(s[:i]+lib+'<script>\n'+js+'</script>\n'+s[i:])
          PY
      - name: Rootfs (Debian)
        run: sudo SMARTOS_BUILD=${{ github.run_number }} bash tiny/deb-rootfs.sh
      - name: ISO
        run: sudo bash tiny/make-iso.sh
      - name: Publish ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=deb-${{ github.run_number }}
          gh release create $T -t "Smart OS Debian $T" -n "Debian + own kernel" out/SmartOS-Tiny.iso out/SmartOS-Tiny.iso.sha256
      - name: Boot test 1GB
        run: |
          mkdir shots
          ACCEL="-accel kvm -cpu host"; [ -w /dev/kvm ] || ACCEL="-accel tcg"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          qemu-system-x86_64 $ACCEL -bios /usr/share/ovmf/OVMF.fd -m 1024 -smp 2 -vga std \
            -cdrom out/SmartOS-Tiny.iso -boot d -display none -serial file:$PWD/serial.log \
            -netdev user,id=n0 -device e1000,netdev=n0 -monitor unix:/tmp/mon,server,nowait &
          sleep 5
          for i in $(seq -w 1 36); do
            echo "screendump $PWD/shots/f$i.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null || true
            sleep 10
          done
          echo quit | socat - UNIX-CONNECT:/tmp/mon || true
          cd shots; for f in *.ppm; do ffmpeg -loglevel error -y -i "$f" "${f%.ppm}.png"; rm "$f"; done
      - name: Install test (disk par install + boot)
        if: always()
        run: |
          mkdir -p shots it; cd it
          xorriso -osirrox on -indev ../out/SmartOS-Tiny.iso -extract /boot/vmlinuz vmlinuz -extract /boot/initrd.gz initrd.gz >/dev/null 2>&1
          qemu-img create -f qcow2 disk.qcow2 8G
          ACCEL="-accel kvm -cpu host"; [ -w /dev/kvm ] || ACCEL="-accel tcg"
          # 1) installer chalao (live ISO + virtio disk)
          timeout 900 qemu-system-x86_64 $ACCEL -m 1536 -smp 2 -vga std -display none -serial file:$PWD/inst-serial.log \
            -cdrom ../out/SmartOS-Tiny.iso -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -kernel vmlinuz -initrd initrd.gz -append "quiet loglevel=3 smartos.autoinstall=/dev/vda console=ttyS0" \
            -netdev user,id=n0 -device e1000,netdev=n0 || echo "install qemu exit $?"
          # 2) disk se boot: UEFI aur BIOS
          for MODE in uefi bios; do
            BIOS=""; [ $MODE = uefi ] && BIOS="-bios /usr/share/ovmf/OVMF.fd"
            qemu-system-x86_64 $ACCEL $BIOS -m 1024 -smp 2 -vga std -display none -serial file:$PWD/$MODE-serial.log \
              -drive file=disk.qcow2,if=virtio,format=qcow2,snapshot=on -netdev user,id=n0 -device e1000,netdev=n0 \
              -monitor unix:/tmp/mon-$MODE,server,nowait &
            QP=$!; sleep 5
            for i in $(seq -w 1 12); do
              echo "screendump $PWD/$MODE-$i.ppm" | socat - UNIX-CONNECT:/tmp/mon-$MODE >/dev/null || true
              sleep 10
            done
            echo quit | socat - UNIX-CONNECT:/tmp/mon-$MODE || true; wait $QP || true
          done
          for f in *.ppm; do ffmpeg -loglevel error -y -i "$f" "../shots/${f%.ppm}.png"; done
          cp *serial.log ../shots/ 2>/dev/null || true
          sudo chmod 644 ../shots/* || true
      - name: Publish test shots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tinytest >/dev/null 2>&1 || gh release create tinytest -t "tiny test shots" -n auto
          for f in shots/*.png; do cp "$f" "d${{ github.run_number }}-$(basename $f)"; done
          [ -s serial.log ] && cp serial.log "d${{ github.run_number }}-serial.txt" || true
          for f in shots/*serial.log; do [ -s "$f" ] && cp "$f" "d${{ github.run_number }}-$(basename $f).txt"; done
          gh release upload tinytest d${{ github.run_number }}-* --clobber
      - name: Publish update (manifest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          sudo tar --owner=0 --group=0 -czf out/smartos-update.tar.gz -C out/rootfs opt/smartos usr/local/bin/smartos-session usr/local/bin/smartos-install usr/local/bin/smartos-zram usr/local/bin/smartos-update-apply etc/smartos-version
          SHA=$(sha256sum out/smartos-update.tar.gz | cut -d' ' -f1); SZ=$(stat -c %s out/smartos-update.tar.gz)
          NOTES=$(git log -1 --pretty=%s | cut -c1-200)
          python3 - "$N" "$SHA" "$SZ" "$NOTES" "$GITHUB_REPOSITORY" <<'PY'
          import json,sys
          n,sha,sz,notes,repo=sys.argv[1:6]
          json.dump({"version":int(n),"url":f"https://github.com/{repo}/releases/download/deb-{n}/smartos-update.tar.gz","sha256":sha,"size":int(sz),"notes":notes,"iso_url":f"https://github.com/{repo}/releases/tag/deb-{n}"},open("out/update.json","w"))
          PY
          cat out/update.json
          gh release upload deb-$N out/smartos-update.tar.gz --clobber
          gh release view updates >/dev/null 2>&1 || gh release create updates -t "Smart OS updates" -n "Auto-update manifest" --latest=false
          gh release upload updates out/update.json --clobber
