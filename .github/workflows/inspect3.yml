name: Inspect initrd splash
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get ISO and look at initrd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq xorriso initramfs-tools-core python3-pil >/dev/null
          mkdir w && cd w
          gh release download iso-3 -R "$GITHUB_REPOSITORY" -p 'SmartOS-Lubuntu.iso.part*'
          cat SmartOS-Lubuntu.iso.part* > in.iso && rm SmartOS-Lubuntu.iso.part*
          xorriso -osirrox on -indev in.iso -extract /casper/initrd initrd.new >/dev/null 2>&1
          mkdir x && unmkinitramfs initrd.new x
          T=x/main/usr/share/plymouth/themes
          echo "=== default.plymouth"; ls -l $T/default.plymouth
          for f in $T/lubuntu-logo/lubuntu-logo.plymouth $T/lubuntu-logo/spinner/spinner.plymouth $T/lubuntu-logo/bgrt/bgrt.plymouth; do echo "--- $f"; cat $f; done
          echo "=== files in lubuntu-logo (non-animation)"
          find $T/lubuntu-logo -type f ! -name 'throbber*' ! -name 'animation*' -printf '%P %s\n'
          find $T/lubuntu-logo -type l -printf 'LINK %P -> %l\n'
          echo "=== sizes"
          find $T/lubuntu-logo -name '*.png' ! -name 'throbber*' ! -name 'animation*' | while read f; do python3 -c "import sys;from PIL import Image;print(sys.argv[1][len(sys.argv[2]):],Image.open(sys.argv[1]).size)" "$f" "$T/"; done
