name: bootshot
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
      ram:
        description: "RAM MB"
        default: "1024"
jobs:
  b:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf socat ffmpeg >/dev/null
      - name: Boot and screenshot
        run: |
          curl -fsSL -o s.iso https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/SmartOS-Tiny.iso
          mkdir shots
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null; sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          ACCEL="-accel kvm -cpu host"; [ -w /dev/kvm ] || ACCEL="-accel tcg"
          qemu-system-x86_64 $ACCEL -bios /usr/share/ovmf/OVMF.fd -m ${{ inputs.ram }} -smp 2 -vga std -cdrom s.iso -boot d -display none \
            -serial file:$PWD/serial.log -netdev user,id=n0 -device e1000,netdev=n0 -monitor unix:/tmp/mon,server,nowait &
          sleep 5
          for i in $(seq 1 18); do echo "screendump $PWD/shots/s$i.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null || true; sleep 10; done
          echo quit | socat - UNIX-CONNECT:/tmp/mon || true
          cd shots; for f in *.ppm; do ffmpeg -loglevel error -y -i "$f" "${f%.ppm}.png"; rm "$f"; done
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view bootshot >/dev/null 2>&1 || gh release create bootshot -t bootshot -n auto --latest=false
          cd shots; for f in s1 s2 s3 s4 s6 s12 s18; do [ -f $f.png ] && cp $f.png ../bs-$f.png; done; cd ..
          [ -s serial.log ] && tail -c 4000 serial.log > bs-serial.txt || true
          gh release upload bootshot bs-* --clobber
